<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#D2D6DB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CH-1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>CH-1 Chord Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Chivo+Mono:wght@400;600&display=swap">
<style>
/* Layout concept: one-screen hardware unit with a persistent transport and a four-tab bar (Play, Build, Layers, Export). Single look by choice: pale aluminium shell, one ember accent that only ever means "active". */
:root{
  --shell:#D2D6DB;
  --well:#C0C5CC;
  --cap:#EEF0F3;
  --cap-lo:#DADEE3;
  --edge:#A2A8B1;
  --ink:#181B1F;
  --ink-2:#4F565F;
  --lcd:#C5CEC1;
  --lcd-lo:#B2BCAE;
  --lcd-ink:#1B241D;
  --lcd-dim:#6B786D;
  --ember:#EF4E1C;
  --ember-lo:#C63A10;
  --on-ember:#FFFFFF;
  --f-lcd:'Chivo Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-label:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-y:auto}
body{
  margin:0;background:var(--shell);color:var(--ink);font-family:var(--f-label);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.device{height:100%;min-height:640px;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px 12px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:30px;line-height:1;font-weight:700;letter-spacing:.02em}
.brand span{font-size:12px;font-weight:600;letter-spacing:.22em;color:var(--ink-2);white-space:nowrap}
.keybtn{height:44px;min-width:122px;border:0;border-radius:12px;background:linear-gradient(180deg,var(--cap),var(--cap-lo));box-shadow:0 3px 0 var(--edge),inset 0 1px 0 #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 10px;flex:none}
.keybtn small{font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--ink-2)}
.keybtn b{font-size:17px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.keybtn:active{transform:translateY(3px);box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}

/* stage and tabs */
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.tab{display:none;flex:1 1 auto;min-height:0;flex-direction:column;gap:10px}
.tab.on{display:flex}
.tab.scroll{overflow-y:auto;overflow-x:hidden;padding:2px 2px 10px;margin:0 -2px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--well);border-radius:14px;padding:4px}
.tabbar button{height:46px;border:0;border-radius:10px;background:transparent;font-size:16px;font-weight:700;letter-spacing:.1em;color:var(--ink-2);padding:0}
.tabbar button[aria-selected="true"]{background:var(--ink);color:var(--cap)}

/* LCD */
.lcd{background:var(--lcd);border-radius:12px;padding:9px 12px 10px;color:var(--lcd-ink);font-family:var(--f-lcd);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.7);display:flex;flex-direction:column;gap:5px;flex:none}
.lcd-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lcd-dim);font-weight:600}
.lcd-top .msg{flex:1;text-align:center;color:var(--lcd-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lcd-top .msg.rec{color:var(--ember-lo)}
.lcd-main{display:flex;align-items:baseline;gap:12px;min-height:56px}
.lcd-main .roman{font-size:20px;font-weight:600;color:var(--lcd-dim);min-width:2.4ch;font-variant-numeric:tabular-nums}
.lcd-main .chord{font-size:52px;line-height:1.05;font-weight:600;letter-spacing:-.03em;white-space:nowrap;min-width:0}
.lcd-notes{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;letter-spacing:.14em;min-height:18px}
.lcd-notes span:last-child{color:var(--lcd-dim);letter-spacing:.08em;font-size:11px;align-self:center;white-space:nowrap}
.kb{position:relative;height:30px;display:flex;border:1px solid var(--lcd-dim);border-radius:3px;overflow:hidden;background:var(--lcd-lo)}
.kb .w{flex:1;background:var(--lcd);border-left:1px solid var(--lcd-dim)}
.kb .w:first-child{border-left:0}
.kb .w.on{background:var(--ember)}
.kb .b{position:absolute;top:0;height:60%;width:3.3%;transform:translateX(-50%);background:var(--lcd-ink);border-radius:0 0 2px 2px}
.kb .b.on{background:var(--ember-lo);box-shadow:0 0 0 1px var(--lcd-ink)}
.kb .c{position:absolute;bottom:1px;font-size:8px;line-height:1;color:var(--lcd-dim);transform:translateX(-50%);pointer-events:none}

/* pads */
.pads{flex:1 1 auto;min-height:130px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:8px}
.pad{position:relative;border:0;border-radius:14px;padding:0;min-width:0;
  background:linear-gradient(180deg,var(--cap),var(--cap-lo));
  box-shadow:0 4px 0 var(--edge),0 8px 12px -6px rgba(0,0,0,.35),inset 0 1px 0 #fff;color:var(--ink);transition:transform .04s}
.pad .rn{position:absolute;left:10px;top:8px;font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--ink-2)}
.pad .nm{position:absolute;left:10px;right:6px;bottom:8px;text-align:left;font-size:27px;line-height:1;font-weight:700;white-space:nowrap;overflow:hidden}
.pad .nm.sm{font-size:21px}
.pad .nm.xs{font-size:17px}
.pad .led{position:absolute;right:9px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--edge);box-shadow:inset 0 1px 1px rgba(0,0,0,.3)}
.pad.on{background:var(--ember);color:var(--on-ember);transform:translateY(4px);box-shadow:0 0 0 var(--edge),inset 0 3px 6px rgba(0,0,0,.3)}
.pad.on .rn{color:var(--on-ember);opacity:.85}
.pad.on .led{background:var(--on-ember);box-shadow:none}
.pad.tie{background:transparent;box-shadow:inset 0 0 0 2px var(--edge)}
.pad.tie[aria-disabled="true"]{opacity:.55}
.pad.tie.on{background:var(--ink);color:var(--cap);box-shadow:none}
.pad.ed{height:62px}
.pad.ed .nm{font-size:22px;bottom:7px}
.pad.ed .nm.sm{font-size:18px}.pad.ed .nm.xs{font-size:15px}
.pad.ed .rn{font-size:13px;top:6px}
.pad.ed .led{display:none}
.pad.ed:active{background:var(--ember);color:var(--on-ember)}

/* generic controls */
.seg{display:flex;flex-direction:column;gap:4px;min-width:0}
.seg>span,.lbl{font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--ink-2)}
.seg .row{display:flex;background:var(--well);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;height:44px;border:0;border-radius:9px;background:transparent;font-size:15px;font-weight:600;letter-spacing:.05em;color:var(--ink-2);padding:0 2px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--cap),var(--cap-lo));color:var(--ink);box-shadow:0 2px 0 var(--edge),inset 0 1px 0 #fff}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.mods .seg button{font-size:14px;height:42px;letter-spacing:.02em}
.grid{display:grid;gap:8px;grid-template-columns:repeat(var(--c,3),1fr)}
.opt{height:50px;border:0;border-radius:12px;min-width:0;padding:0 4px;background:linear-gradient(180deg,var(--cap),var(--cap-lo));box-shadow:0 3px 0 var(--edge),inset 0 1px 0 #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:17px;font-weight:700;letter-spacing:.03em}
.opt small{font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;min-height:11px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.opt.big{height:56px;font-size:19px}
.opt[aria-pressed="true"]{background:var(--ember);color:var(--on-ember);transform:translateY(3px);box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.opt[aria-pressed="true"] small{color:var(--on-ember);opacity:.9}
.card{background:var(--well);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;flex:none}
.card .seg .row{background:var(--shell)}
.act{height:52px;width:100%;border:0;border-radius:12px;background:linear-gradient(180deg,var(--cap),var(--cap-lo));box-shadow:0 3px 0 var(--edge),inset 0 1px 0 #fff;font-size:17px;font-weight:700;letter-spacing:.08em;padding:0 8px}
.act:active{transform:translateY(3px);box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.act.arm{background:var(--ink);color:var(--cap)}
.act.go{background:var(--ink);color:var(--cap);box-shadow:0 3px 0 #000;height:58px;font-size:20px}
.act.hot{background:var(--ember);color:var(--on-ember);box-shadow:0 3px 0 var(--ember-lo)}
.sw{height:56px;width:100%;border:0;border-radius:12px;background:var(--shell);box-shadow:inset 0 0 0 2px var(--edge);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:20px;font-weight:700;letter-spacing:.08em}
.sw i{font-style:normal;font-size:14px;letter-spacing:.14em;color:var(--ink-2)}
.sw[aria-pressed="true"]{background:var(--ember);color:var(--on-ember);box-shadow:0 3px 0 var(--ember-lo)}
.sw[aria-pressed="true"] i{color:var(--on-ember)}
.hint{margin:0;font-size:14px;line-height:1.35;color:var(--ink-2);font-weight:500}
.sum{display:flex;flex-direction:column;gap:6px;font-size:16px;font-weight:600;letter-spacing:.03em}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum div b{text-align:right;min-width:0;overflow-wrap:anywhere}
.sum span:first-child{color:var(--ink-2);letter-spacing:.14em;font-size:12px;align-self:center;flex:none}

/* transport */
.transport{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;flex:none}
.key{height:46px;border:0;border-radius:10px;background:linear-gradient(180deg,var(--cap),var(--cap-lo));box-shadow:0 3px 0 var(--edge),inset 0 1px 0 #fff;font-size:17px;font-weight:700;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;gap:8px;padding:0}
.key:active{transform:translateY(3px);box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.key .dot{width:11px;height:11px;border-radius:50%;background:var(--ember)}
.key[aria-pressed="true"]{background:var(--ember);color:var(--on-ember);transform:translateY(3px);box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.key[aria-pressed="true"] .dot{background:var(--on-ember)}
.key .tri{width:0;height:0;border-left:12px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent}
.key .sq{width:11px;height:11px;background:currentColor;border-radius:2px}
.bpm{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;background:var(--well);border-radius:10px;height:46px;padding:0 3px;gap:2px}
.bpm button{height:40px;border:0;background:transparent;font-size:22px;font-weight:600;border-radius:8px;padding:0}
.bpm button:active{background:var(--cap-lo)}
.bpm .val{text-align:center;line-height:1}
.bpm small{display:block;font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--ink-2);margin-bottom:2px}
.bpm b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}

/* step strip */
.steps{display:grid;gap:6px;flex:none}
.step{position:relative;height:54px;border:0;border-radius:9px;background:var(--shell);padding:0;min-width:0;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--edge)}
.step .n{position:absolute;left:5px;top:4px;font-size:10px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.step .nm{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:17px;font-weight:700;line-height:1;white-space:nowrap;overflow:hidden}
.step .nm.sm{font-size:13px}
.step .rr{position:absolute;left:0;right:0;top:15px;text-align:center;font-size:11px;font-weight:600;color:var(--ink-2)}
.step.empty .nm{color:var(--edge);font-weight:600}
.step.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.step.now{background:var(--ember);color:var(--on-ember);box-shadow:none}
.step.now .n,.step.now .rr{color:var(--on-ember)}
.step.sel.now{box-shadow:inset 0 0 0 3px var(--ink)}

/* sheet (key picker) */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(24,27,31,.5)}
.panel{position:relative;width:100%;max-width:440px;max-height:88%;overflow-y:auto;background:var(--shell);border-radius:22px 22px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -12px 32px rgba(0,0,0,.3);animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel h2{margin:0;font-size:24px;font-weight:700;letter-spacing:.02em}
.done{height:44px;min-width:84px;border:0;border-radius:12px;background:var(--ink);color:var(--cap);font-size:17px;font-weight:700;letter-spacing:.06em;padding:0 16px}
.group{display:flex;flex-direction:column;gap:14px}
.opt.scale{align-items:flex-start;padding:0 12px;font-size:19px;height:54px}
.opt.keyo{height:54px;font-size:21px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--cap);font-size:15px;font-weight:600;letter-spacing:.08em;padding:10px 16px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.35);pointer-events:none;text-align:center}

@media (max-height:740px){
  .lcd-main{min-height:46px}.lcd-main .chord{font-size:42px}
  .kb{height:24px}.step{height:48px}.key{height:42px}.bpm{height:42px}
  .tabbar button{height:42px}.mods .seg button{height:38px}
}
@media (prefers-reduced-motion:reduce){.pad{transition:none}.panel{animation:none}}
</style>

<main class="device" id="device">
  <header class="top">
    <div class="brand"><b>CH-1</b><span>CHORD FORGE</span></div>
    <button type="button" class="keybtn" id="bKey" aria-label="Choose key and scale"><small>KEY</small><b id="bbKey">C MAJOR</b></button>
  </header>

  <div class="stage">
    <!-- PLAY -->
    <section class="tab on" data-tab="play" aria-label="Play">
      <div class="lcd" aria-label="Display">
        <div class="lcd-top"><span id="lcdKey">C MAJOR</span><span class="msg" id="lcdMsg"></span><span id="lcdBpm">88 BPM</span></div>
        <div class="lcd-main" aria-live="polite"><span class="roman" id="lcdRoman">I</span><span class="chord" id="lcdChord">C</span></div>
        <div class="lcd-notes"><span id="lcdNotes">C  E  G</span><span id="lcdInv">READY</span></div>
        <div class="kb" id="kb" aria-hidden="true"></div>
      </div>
      <div class="pads" id="pads" aria-label="Chord pads"></div>
      <div class="mods" id="modsPlay"></div>
      <div class="steps" id="steps" role="group" aria-label="Progression steps"></div>
    </section>

    <!-- BUILD -->
    <section class="tab scroll" data-tab="build" aria-label="Build a progression">
      <div class="card">
        <div class="lbl">PROGRESSION &middot; TAP A STEP, THEN A CHORD</div>
        <div class="steps" id="steps2" role="group" aria-label="Progression steps"></div>
        <div class="grid" style="--c:4" id="edPads"></div>
        <button type="button" class="opt" id="edTie" style="width:100%">TIE (HOLD THE PREVIOUS CHORD)</button>
        <div class="mods" id="modsBuild"></div>
      </div>
      <div class="card" id="cardGen"></div>
      <div class="card" id="cardPresets"></div>
      <div class="card" id="cardFeel"></div>
    </section>

    <!-- LAYERS -->
    <section class="tab scroll" data-tab="layers" aria-label="Layers" id="tabLayers"></section>

    <!-- EXPORT -->
    <section class="tab scroll" data-tab="export" aria-label="Export" id="tabExport"></section>
  </div>

  <div class="transport">
    <button type="button" class="key" id="rec" aria-pressed="false"><span class="dot"></span>REC</button>
    <button type="button" class="key" id="play" aria-pressed="false"><span class="tri" id="playIcon"></span><span id="playTxt">PLAY</span></button>
    <div class="bpm">
      <button type="button" id="bpmDn" aria-label="Slower">&#8722;</button>
      <div class="val"><small>TEMPO</small><b id="bpmVal">88</b></div>
      <button type="button" id="bpmUp" aria-label="Faster">+</button>
    </div>
  </div>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button type="button" role="tab" data-tabbtn="play" aria-selected="true">PLAY</button>
    <button type="button" role="tab" data-tabbtn="build" aria-selected="false">BUILD</button>
    <button type="button" role="tab" data-tabbtn="layers" aria-selected="false">LAYERS</button>
    <button type="button" role="tab" data-tabbtn="export" aria-selected="false">EXPORT</button>
  </nav>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <header><h2 id="shTitle">Key &amp; scale</h2><button type="button" class="done" id="shDone">Done</button></header>
    <div class="group">
      <div class="lbl">KEY</div><div class="grid" style="--c:4" id="keyGrid"></div>
      <div class="lbl">SCALE</div><div class="grid" style="--c:2" id="scaleGrid"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];

/* ================= theory ================= */
const NOTE_S=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_F=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const MODES=[
  {name:'MAJOR',short:'MAJOR',hint:'bright',s:[0,2,4,5,7,9,11],p:0},
  {name:'MINOR',short:'MINOR',hint:'dark',s:[0,2,3,5,7,8,10],p:9},
  {name:'DORIAN',short:'DORIAN',hint:'soulful',s:[0,2,3,5,7,9,10],p:2},
  {name:'MIXOLYDIAN',short:'MIXO',hint:'bluesy',s:[0,2,4,5,7,9,10],p:7},
  {name:'LYDIAN',short:'LYDIAN',hint:'dreamy',s:[0,2,4,6,7,9,11],p:5},
  {name:'PHRYGIAN',short:'PHRYG',hint:'spanish',s:[0,1,3,5,7,8,10],p:4},
  {name:'HARMONIC MINOR',short:'H.MIN',hint:'dramatic',s:[0,2,3,5,7,8,11],p:9}
];
const ROMAN=['I','II','III','IV','V','VI','VII'];
const LO=48,HI=83;

/* ================= parameter registry (drives UI, validation, persistence) ================= */
const onoff=[[0,'OFF'],[1,'ON']];
const regs=[[0,'LOW'],[1,'MID'],[2,'HIGH']];
const vols=[[0,'SOFT'],[1,'MED'],[2,'LOUD']];
const VOICES={chords:['KEYS','PAD','PLUCK'],arp:['PLUCK','KEYS','PAD'],bass:['SUB','SAW','PLUCK'],mel:['LEAD','KEYS','PLUCK']};
const KINDS={chords:['keys','pad','pluck'],arp:['pluck','keys','pad'],bass:['sub','saw','pluck'],mel:['lead','keys','pluck']};
const GM={chords:[4,89,24],arp:[46,4,89],bass:[38,39,33],mel:[80,4,24]};

function useFlats(){ const p=((st.key-MODES[st.mode].p)%12+12)%12; return [5,10,3,8,1].includes(p); }
const spell=pc=>(useFlats()?NOTE_F:NOTE_S)[((pc%12)+12)%12];

function suffixFor(th,fi,sv,has9){
  const T={
    '4-7':{n:'',10:'7',11:'maj7',9:'6'},
    '3-7':{n:'m',10:'m7',11:'m(maj7)',9:'m6'},
    '3-6':{n:'dim',9:'dim7',10:'m7b5',11:'dim(maj7)'},
    '4-8':{n:'aug',10:'7#5',11:'maj7#5',9:'aug6'},
    '4-6':{n:'b5',10:'7b5',11:'maj7b5',9:'6b5'}
  };
  const row=T[th+'-'+fi]||{n:'?'};
  let s=sv===undefined?row.n:(row[sv]!==undefined?row[sv]:'');
  if(has9&&sv!==undefined){ s=/6$/.test(s)?s+'/9':s.replace('7','9'); }
  return s;
}
function buildChord(c){
  const S=MODES[st.mode].s;
  const deg=i=>{const x=c.d+i;return S[x%7]+12*Math.floor(x/7);};
  const base=deg(0);
  const ks=[0,c.sus===2?1:c.sus===4?3:2,4];
  if(c.ext>=1) ks.push(6);
  if(c.ext>=2&&c.sus!==2) ks.push(8);
  const iv=ks.map(k=>deg(k)-base);
  const rootPc=(st.key+S[c.d])%12;
  const th=iv[1],fi=iv[2],sv=iv[3],has9=iv.length>4;
  let name;
  if(c.sus){
    const sx=c.sus===2?'sus2':'sus4';
    let q='';
    if(sv!==undefined) q=has9?(sv===11?'maj9':sv===10?'9':'6/9'):(sv===11?'maj7':sv===10?'7':'6');
    name=spell(rootPc)+q+sx;
  } else name=spell(rootPc)+suffixFor(th,fi,sv,has9);
  let rn=ROMAN[c.d];
  if(!c.sus&&th===3) rn=rn.toLowerCase();
  if(!c.sus&&th===3&&fi===6) rn+='°';
  if(!c.sus&&fi===8) rn+='+';
  return {iv,rootPc,name,roman:rn};
}
let lastCentroid=null;
function chooseVoicing(iv,rootPc){
  const target=lastCentroid==null?62:lastCentroid*0.7+62*0.3;
  let best=null;
  for(let inv=0;inv<iv.length;inv++){
    for(const oct of [0,12]){
      const notes=iv.map((x,j)=>LO+rootPc+x+(j<inv?12:0)+oct).sort((a,b)=>a-b);
      if(notes[0]<LO||notes[notes.length-1]>HI) continue;
      const cen=notes.reduce((a,b)=>a+b,0)/notes.length;
      const span=notes[notes.length-1]-notes[0];
      const score=Math.abs(cen-target)+(span>17?2:0);
      if(!best||score<best.score) best={notes,inv,cen,score};
    }
  }
  return best;
}
function voiceChord(c){
  const b=buildChord(c);
  const v=chooseVoicing(b.iv,b.rootPc);
  lastCentroid=v.cen;
  return Object.assign({},b,{notes:v.notes,inv:v.inv});
}

/* ================= pattern engine: one source for audio and MIDI ================= */
function swingShift(p){
  const sw=SWING[st.swing];if(!sw) return 0;
  const f=((p%1)+1)%1;
  if(Math.abs(f-.5)<1e-3) return sw;
  if(Math.abs(f-.25)<1e-3||Math.abs(f-.75)<1e-3) return sw*.5;
  return 0;
}
function hitsFor(pat,beats){
  const res=[];
  if(!pat.len){ res.push({p:0,d:Math.max(.1,beats-.04),k:pat.hits[0][2]}); return res; }
  for(let base=0;base<beats-1e-6;base+=pat.len){
    for(const h of pat.hits){
      const pp=base+h[0];
      if(pp<beats-1e-6) res.push({p:pp,d:Math.max(.08,Math.min(h[1],beats-pp-.02)),k:h[2]});
    }
  }
  return res;
}
function arpOrder(n,pat){
  const up=[...Array(n).keys()];
  switch(pat){
    case 0: return up;
    case 1: return up.slice().reverse();
    case 2: return n>2?up.concat(up.slice(1,-1).reverse()):up;
    case 4: { const o=[];let a=0,b=n-1;while(a<=b){o.push(a++);if(a<=b) o.push(b--);} return o; }
    case 5: { const o=[];for(let i=0;i<n-1;i++){o.push(i);o.push(n-1);} return o.length?o:up; }
    default: return null;
  }
}
function arpNotes(ch,L){
  const r=48+ch.rootPc+12*L.reg;
  const out=[];
  for(let o=0;o<L.oct;o++) ch.iv.forEach(x=>{ const m=r+x+12*o; if(m<=108) out.push(m); });
  return out;
}
const bassBase=(ch,L)=>24+12*L.reg+ch.rootPc;   // LOW 24-35, MID 36-47, HIGH 48-59
const IVK=(ch,k)=>k==='o'?12:k==='f'?ch.iv[2]:k==='t'?ch.iv[1]:0;

function stepEvents(out,ch,beats,abs){
  const Ly=st.layers;
  const anyOn=LAYER_KEYS.some(k=>Ly[k].on);
  if(Ly.chords.on||!anyOn){
    const L=Ly.chords,pat=C_RHYTHMS[L.rhythm],strum=[0,.05,.14][L.strum];
    hitsFor(pat,beats).forEach(h=>{
      ch.notes.forEach((m,idx)=>{
        const off=idx*strum;
        out.push({layer:'chords',beat:abs+h.p+off+swingShift(h.p),dur:Math.max(.08,h.d-off),note:m,vel:idx===ch.notes.length-1?80:88});
      });
    });
  }
  if(Ly.arp.on){
    const L=Ly.arp,R=A_RATES[L.rate],notes=arpNotes(ch,L),ord=arpOrder(notes.length,L.pattern),n=Math.floor(beats/R+1e-6);
    for(let i=0;i<n;i++){
      const idx=ord?ord[i%ord.length]:rnd(notes.length);
      const p=i*R,accent=R<=.5&&Math.abs(p%1)<1e-3;
      out.push({layer:'arp',beat:abs+p+swingShift(p),dur:Math.max(.05,R*A_GATES[L.gate]),note:notes[idx],vel:accent?96:78});
    }
  }
  if(Ly.bass.on){
    const L=Ly.bass,pat=B_PATTERNS[L.pattern],root=bassBase(ch,L);
    hitsFor(pat,beats).forEach(h=>{
      out.push({layer:'bass',beat:abs+h.p+swingShift(h.p),dur:h.d,note:root+IVK(ch,h.k),vel:Math.abs(h.p%4)<1e-3?108:98});
    });
  }
}
const melMidi=deg=>{ const S=MODES[st.mode].s,tonic=60+(st.key>6?st.key-12:st.key); return tonic+S[((deg%7)+7)%7]+12*Math.floor(deg/7); };

function buildLoop(){
  const saved=lastCentroid;lastCentroid=null;
  const ev=[],marks=[],len=st.len,total=st.nSteps*len;
  for(let i=0;i<st.nSteps;i++){
    const c=st.steps[i];
    if(c&&c.t==='c'){
      let n=1;
      for(let k=1;i+k<st.nSteps;k++){ const x=st.steps[i+k]; if(x&&x.t==='tie') n++; else break; }
      const ch=voiceChord(c);
      stepEvents(ev,ch,n*len,i*len);
      marks.push({beat:i*len,i,ch,beats:n*len});
    } else marks.push({beat:i*len,i,ch:null,beats:len});
  }
  lastCentroid=saved;
  if(st.layers.mel.on){
    st.layers.mel.notes.forEach(n=>{
      if(n.b>=total) return;
      const d=Math.min(n.d,total-n.b);
      ev.push({layer:'mel',beat:n.b+swingShift(n.b),dur:Math.max(.08,d*.95),note:melMidi(n.deg),vel:n.v||90});
    });
  }
  ev.sort((a,b)=>a.beat-b.beat);
  return {ev,marks,total};
}

/* ================= melody generator ================= */
function chordAtBeat(b){
  const i=Math.min(st.nSteps-1,Math.floor(b/st.len+1e-9));
  if(!st.steps[i]) return null;
  let j=i;while(j>=0&&st.steps[j]&&st.steps[j].t==='tie') j--;
  return j>=0&&st.steps[j]&&st.steps[j].t==='c'?st.steps[j]:null;
}
function genMelody(){
  const L=st.layers.mel,total=st.nSteps*st.len;
  const dens=[{u:1,rest:.35},{u:.5,rest:.3},{u:.25,rest:.3}][L.density];
  const lo=L.range?1:3,hi=L.range?13:10;
  const notes=[];let prev=null,busy=0,same=0;
  for(let t=0;t<total-1e-6;t+=dens.u){
    if(t<busy-1e-6) continue;
    const c=chordAtBeat(t);
    if(!c) continue;
    const tones=[c.d,c.d+2,c.d+4].concat(c.ext?[c.d+6]:[]).map(x=>x%7);
    const strong=Math.abs(t%1)<1e-6;
    let pr=dens.rest*(t%4>=3?1.5:1);
    if(Math.abs(t%st.len)<1e-6) pr*=.3;
    if(Math.random()<pr) continue;
    let deg;
    if(prev==null||strong){
      const ref=prev==null?(lo+hi)/2:prev,cands=[];
      for(let d=lo;d<=hi;d++) if(tones.includes(d%7)) cands.push({d,s:Math.abs(d-ref)+Math.random()*2});
      cands.sort((a,b)=>a.s-b.s);
      deg=cands[0].d;
    } else {
      deg=Math.max(lo,Math.min(hi,prev+pick([-2,-1,-1,1,1,2,-3,3])));
    }
    if(deg===prev){ same++; if(same>1) deg=Math.max(lo,Math.min(hi,deg+pick([-1,1]))); } else same=0;
    let d=dens.u*.92;
    if(Math.random()<.28) d=dens.u*2-.05;
    d=Math.min(d,total-t);
    notes.push({b:t,d:Math.round(d*1000)/1000,deg,v:strong?96:84});
    prev=deg;busy=t+d;
  }
  L.notes=notes;
}

/* ================= progression tools ================= */
const PRESETS=[
  {n:'POP',d:[0,4,5,3]},{n:'SAD',d:[5,3,0,4]},{n:'50s',d:[0,5,3,4]},{n:'JAZZ',d:[1,4,0,5],e:1},
  {n:'LOFI',d:[2,5,1,4],e:1},{n:'SOUL',d:[0,5,1,4],e:2},{n:'DARK',d:[0,5,2,6]},{n:'EPIC',d:[5,4,3,4]},
  {n:'ANDALUSIAN',d:[0,6,5,4]},{n:'UPLIFT',d:[3,4,2,5]},{n:'DREAMY',d:[0,2,3,4],e:1},{n:'CANON',d:[0,4,5,2,3,0,3,4]}
];
const TRANS={0:[[3,3],[4,3],[5,3],[1,1],[2,1]],1:[[4,4],[6,1],[3,2]],2:[[5,3],[3,2],[1,1]],3:[[4,4],[0,3],[1,2],[5,1]],4:[[0,4],[5,3],[2,1]],5:[[3,4],[1,3],[4,2]],6:[[0,3],[2,2]]};
function pickW(list){let t=list.reduce((a,x)=>a+x[1],0),r=Math.random()*t;for(const x of list){r-=x[1];if(r<=0)return x[0];}return list[0][0];}
function genProg(spice){
  const n=st.nSteps,out=[];
  let d=Math.random()<.65?0:5;
  for(let i=0;i<n;i++){
    if(i>0){
      let opts=TRANS[d];
      if(i===n-1&&n>=4) opts=[[4,4],[3,2],[1,1],[5,1]];
      const nd=pickW(opts.filter(x=>x[0]!==d));
      d=nd;
    }
    const r=Math.random();
    const ext=spice===0?0:spice===1?(r<.45?1:0):(r<.35?1:r<.7?2:0);
    const sus=spice>=1&&Math.random()<.1?pick([2,4]):0;
    out.push({t:'c',d,ext,sus});
  }
  while(out.length<8) out.push(null);
  st.steps=out;st.sel=0;
}

let ctx=null,bus=null,unlocked=false;
function impulse(c,sec,decay){
  const len=Math.floor(c.sampleRate*sec),buf=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
  return buf;
}
function silentWav(){
  const n=800,sr=8000,buf=new ArrayBuffer(44+n),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i,128);
  let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]);
  return 'data:audio/wav;base64,'+btoa(s);
}
function unlockIOS(){
  if(unlocked) return; unlocked=true;
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  try{ const a=new Audio(silentWav()); a.loop=true; a.volume=0.05; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
}
function ensureAudio(){
  if(ctx){ if(ctx.state!=='running'){ try{ctx.resume();}catch(e){} } return ctx; }
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  try{ ctx=new AC({latencyHint:'balanced'}); }catch(e){ try{ ctx=new AC(); }catch(e2){ return null; } }
  const master=ctx.createGain(); master.gain.value=0.85;
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-20;comp.knee.value=14;comp.ratio.value=5;comp.attack.value=0.006;comp.release.value=0.25;
  const lim=ctx.createDynamicsCompressor(); // safety limiter so stacked layers never clip
  lim.threshold.value=-3;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=0.002;lim.release.value=0.1;
  bus=ctx.createGain(); bus.gain.value=0.4; bus.connect(master);
  const conv=ctx.createConvolver(); conv.buffer=impulse(ctx,1.3,2.4);
  const wet=ctx.createGain(); wet.gain.value=0.2; bus.connect(conv); conv.connect(wet); wet.connect(master);
  master.connect(comp); comp.connect(lim); lim.connect(ctx.destination);
  try{ ctx.resume(); }catch(e){}
  unlockIOS();
  ctx.onstatechange=updateSig;
  return ctx;
}

/* One note. vel 0..1.3. Returns {release(t)}. The envelope lives in `env`; release lives in `out`, so a note can be cut at any moment. */
function playNote(m,t,vel,kind){

  const filt=(fq,q)=>{const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=fq;lp.Q.value=q;lp.connect(env);return lp;};
  if(kind==='keys'){
    const lp=filt(3200,.4);
    mk('triangle',f).connect(lp);
    const bg=ctx.createGain();bg.gain.setValueAtTime(.5*g,t);bg.gain.setTargetAtTime(0,t,.1);
    mk('sine',f*2).connect(bg);bg.connect(lp);
    const pk=.22*g;
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(pk,t+.006);
    env.gain.setTargetAtTime(pk*.45,t+.006,.55);env.gain.setTargetAtTime(.0001,t+1.6,2.2);
    relTc=.14;
  } else if(kind==='pad'){
    const lp=filt(380,.6);
    lp.frequency.setValueAtTime(380,t);lp.frequency.linearRampToValueAtTime(1500,t+.7);
    mk('sawtooth',f,-7).connect(lp);mk('sawtooth',f,7).connect(lp);
    const pk=.075*g;
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(pk,t+.22);
    relTc=.4;
  } else if(kind==='pluck'){
    const lp=filt(4600,1.2);
    lp.frequency.setValueAtTime(4600,t);lp.frequency.setTargetAtTime(520,t,.11);
    mk('sawtooth',f).connect(lp);mk('triangle',f/2).connect(lp);
    const pk=.2*g;
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(pk,t+.004);
    env.gain.setTargetAtTime(.0001,t+.01,.34);
    relTc=.08;
  } else if(kind==='sub'){
    mk('sine',f).connect(env);
    const h=ctx.createGain();h.gain.value=.14;mk('triangle',f*2).connect(h);h.connect(env);
    const pk=.34*g;
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(pk,t+.012);
    env.gain.setTargetAtTime(pk*.72,t+.03,.5);
    relTc=.07;
  } else if(kind==='saw'){
    const lp=filt(900,2);
    lp.frequency.setValueAtTime(1100,t);lp.frequency.setTargetAtTime(280,t,.14);
    mk('sawtooth',f).connect(lp);mk('sine',f).connect(env);
    const pk=.17*g;
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(pk,t+.006);
    env.gain.setTargetAtTime(pk*.6,t+.01,.4);
    relTc=.08;
  } else { // lead
    const lp=filt(2600,.7);
    const a=mk('sawtooth',f);a.connect(lp);
    const sq=ctx.createGain();sq.gain.value=.5;const b=mk('square',f,6);b.connect(sq);sq.connect(lp);
    const lfo=ctx.createOscillator();lfo.frequency.value=5.5;oscs.push(lfo);
    const lg=ctx.createGain();lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.006,t+.4);
    lfo.connect(lg);lg.connect(a.frequency);lg.connect(b.frequency);
    const pk=.11*g;
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(pk,t+.015);
    env.gain.setTargetAtTime(pk*.8,t+.05,.3);
    relTc=.14;
  }
  oscs.forEach(o=>o.start(t));
  let relT=Infinity,stopped=false;
  const stopOnce=at=>{ if(stopped) return; stopped=true; oscs.forEach(o=>safeStop(o,at)); };
  return {
    endT:Infinity,
    release(tr){
      const now=ctx.currentTime;
      if(tr<=t){ // cancelled before it began: make sure it never sounds
        if(relT===-1) return;
        relT=-1;this.endT=t;
        try{ out.gain.cancelScheduledValues(0); out.gain.setValueAtTime(0,now); }catch(e){}
        stopOnce(Math.max(t,now));
        return;
      }
      tr=Math.max(tr,now);
      if(tr>=relT) return;
      relT=tr;this.endT=tr+relTc*6;
      try{ out.gain.cancelScheduledValues(tr); out.gain.setTargetAtTime(0,tr,relTc); }catch(e){}
      stopOnce(tr+relTc*6);   // Safari allows only one stop(); the gain is already ~-50 dB by then
    }
  };
}

/* manual play (pads): chords + bass + arp, held until release */
function startManual(ch,dur){
  const Ly=st.layers,hs=[];
  const anyOn=LAYER_KEYS.some(k=>Ly[k].on);
  const h={timer:null,done:false,release(tr){
    if(tr===undefined) tr=ctx.currentTime;
    h.done=true;if(h.timer){clearInterval(h.timer);h.timer=null;}
    hs.forEach(x=>x.release(tr));
  }};
  const t=ctx.currentTime+.004,vm=k=>VOL_M[Ly[k].vol];
  if(Ly.chords.on||!anyOn){
    const L=Ly.chords,strum=[0,.03,.08][L.strum];
    ch.notes.forEach((m,i)=>hs.push(playNote(m,t+i*strum,(.88+Math.random()*.12)*vm('chords'),KINDS.chords[L.voice])));
  }
  if(Ly.bass.on) hs.push(playNote(bassBase(ch,Ly.bass),t,vm('bass')*LAYER_G.bass,KINDS.bass[Ly.bass.voice]));
  if(Ly.arp.on){
    const L=Ly.arp,sec=60/st.bpm*A_RATES[L.rate],notes=arpNotes(ch,L),ord=arpOrder(notes.length,L.pattern);
    let i=0,nt=t;
    h.timer=setInterval(()=>{
      if(h.done||!ctx) return;
      if(nt<ctx.currentTime) nt=ctx.currentTime;
      while(nt<ctx.currentTime+.12){
        const idx=ord?ord[i%ord.length]:rnd(notes.length);
        const hd=playNote(notes[idx],nt,.85*vm('arp')*LAYER_G.arp,KINDS.arp[L.voice]);
        hd.release(nt+sec*A_GATES[L.gate]);hs.push(hd);i++;nt+=sec;
      }
      if(hs.length>160) hs.splice(2,hs.length-100);
    },25);
  }
  if(dur!=null) h.release(t+dur);
  track(h);
  return h;
}

      b.setAttribute('aria-label','Step '+(i+1)+': '+(st.steps[i]?(t.nm==='~'?'tie':t.nm):'empty'));
    });
  });
}
if(st.sel>=st.nSteps) st.sel=0;
function onStepTap(i){
  st.sel=i;
  const c=st.steps[i];
  if(!playing&&c&&c.t==='c'&&ensureAudio()){
    const ch=voiceChord(c);
    const d=Math.min(1.2,60/st.bpm*2);
    startManual(ch,d);
    showChord(ch);
    seqLit={notes:ch.notes,until:ctx.currentTime+d};paintKeys();
  }
  renderSteps();save();
}
function writeStep(c){
  let i;
  if(playing&&curStep>=0&&ctx){
    i=curStep;
    if(curDur>0&&(ctx.currentTime-curStart)/curDur>0.72) i=(curStep+1)%st.nSteps;
  } else i=st.sel;
  st.steps[i]=c;loopDirty=true;
  if(!playing) st.sel=(i+1)%st.nSteps;
  renderSteps();save();
}
function toggleRec(){
  st.rec=!st.rec;
  $('#rec').setAttribute('aria-pressed',String(st.rec));
  padEls[7].setAttribute('aria-disabled',st.rec?'false':'true');
  baseMsg();
  toast(st.rec?'REC ARMED. TAP PADS TO WRITE':'REC OFF');
}
$('#rec').addEventListener('click',toggleRec);
$$('#edPads .pad').forEach((p,d)=>p.addEventListener('click',()=>{
  const c={t:'c',d,ext:st.ext,sus:st.sus};
  st.steps[st.sel]=c;loopDirty=true;
  if(!playing&&ensureAudio()){ const ch=voiceChord(c); startManual(ch,Math.min(1.2,60/st.bpm*2)); }
  st.sel=(st.sel+1)%st.nSteps;
  renderSteps();save();
}));
$('#edRest').addEventListener('click',()=>{ st.steps[st.sel]=null;loopDirty=true;st.sel=(st.sel+1)%st.nSteps;renderSteps();save(); });
$('#edTie').addEventListener('click',()=>{ st.steps[st.sel]={t:'tie'};loopDirty=true;st.sel=(st.sel+1)%st.nSteps;renderSteps();save(); });

/* ================= scheduler ================= */
let loop=null,loopT0=0,ei=0,mi=0,schedBeat=0;
async function play(){
  if(!ensureAudio()){ toast('NO AUDIO IN THIS BROWSER'); return; }
  if(!LAYER_KEYS.some(k=>st.layers[k].on)){ st.layers.chords.on=1;loopDirty=true;refreshAll(); }
  playing=true;uiQ=[];curStep=-1;
  loop=buildLoop();loopDirty=false;ei=0;mi=0;schedBeat=0;
  loopT0=ctx.currentTime+.08;
  seqTimer=setInterval(tick,40);
  $('#play').setAttribute('aria-pressed','true');
  $('#playTxt').textContent='STOP';$('#playIcon').className='sq';
  baseMsg();
  try{ if(navigator.wakeLock) wake=await navigator.wakeLock.request('screen'); }catch(e){}
}
function stop(){
  playing=false;
  clearInterval(seqTimer);seqTimer=null;
  if(ctx){
    const now=ctx.currentTime;
    const byHand=new Set();held.forEach(v=>{ if(v.h) byHand.add(v.h); });
    live.forEach(h=>{ if(!byHand.has(h)) h.release(now); });
    live.clear();byHand.forEach(h=>live.add(h));
  }
  uiQ=[];curStep=-1;seqLit=null;
  $('#play').setAttribute('aria-pressed','false');
  $('#playTxt').textContent='PLAY';$('#playIcon').className='tri';
  try{ if(wake){wake.release();wake=null;} }catch(e){}
  baseMsg();renderSteps();paintKeys();
}
function togglePlay(){ playing?stop():play(); }
function schedEvent(e,spb){
  const L=st.layers[e.layer];
  let t=loopT0+e.beat*spb;
  const hm=HUM_MS[st.human]/1000;
  if(hm) t+=(Math.random()*2-1)*hm;
  const now=ctx.currentTime;if(t<now+.005) t=now+.005;
  let v=e.vel/127*VOL_M[L.vol]*LAYER_G[e.layer]*1.1;
  if(st.human) v*=1+(Math.random()*2-1)*.06*st.human;
  const h=playNote(e.note,t,v,KINDS[e.layer][L.voice]);
  h.release(t+e.dur*spb);
  track(h);
}
function tick(){
  if(!playing||!ctx) return;
  const spb=60/st.bpm,horizon=ctx.currentTime+.4;
  for(let guard=0;guard<4;guard++){
    if(loopDirty){
      loop=buildLoop();loopDirty=false;
      ei=loop.ev.findIndex(e=>e.beat>=schedBeat-1e-9);if(ei<0) ei=loop.ev.length;
      mi=loop.marks.findIndex(m=>m.beat>=schedBeat-1e-9);if(mi<0) mi=loop.marks.length;
    }
    const total=loop.total,pos=(horizon-loopT0)/spb,lim=Math.min(total,pos);
    while(ei<loop.ev.length&&loop.ev[ei].beat<lim){ schedEvent(loop.ev[ei],spb);ei++; }
    while(mi<loop.marks.length&&loop.marks[mi].beat<lim){
      const m=loop.marks[mi],t=loopT0+m.beat*spb;
      uiQ.push({t,i:m.i,stepSec:st.len*spb,ch:m.ch,until:loopT0+(m.beat+m.beats)*spb});mi++;
    }
    schedBeat=lim;
    if(pos>=total){ loopT0+=total*spb;ei=0;mi=0;schedBeat=0;continue; }
    break;
  }
}
function frame(){
  if(ctx&&uiQ.length){
    const now=ctx.currentTime;
    let hit=null;
    while(uiQ.length&&uiQ[0].t<=now){ hit=uiQ.shift(); }
    if(hit){
      curStep=hit.i;curStart=hit.t;curDur=hit.stepSec;
      if(hit.ch){ showChord(hit.ch); seqLit={notes:hit.ch.notes,until:hit.until-0.02}; }
      stripEls.forEach(el=>$$('.step',el).forEach((b,i)=>b.classList.toggle('now',i===curStep)));
    }
  }
  paintKeys();
  requestAnimationFrame(frame);
}
$('#play').addEventListener('click',togglePlay);
function setBpm(v){
  v=Math.max(50,Math.min(180,v));
  if(playing&&ctx){ const cur=(ctx.currentTime-loopT0)/(60/st.bpm); st.bpm=v; loopT0=ctx.currentTime-cur*(60/v); }
  else st.bpm=v;
  renderTune();save();
}
function holdRepeat(btn,delta){
  let to=null,iv=null;
  const bump=()=>setBpm(st.bpm+delta);
  const end=()=>{ clearTimeout(to);clearInterval(iv);to=iv=null; };
  btn.addEventListener('pointerdown',e=>{ e.preventDefault(); bump(); to=setTimeout(()=>{ iv=setInterval(bump,70); },380); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,end));
  btn.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); bump(); } });
}
holdRepeat($('#bpmDn'),-1);holdRepeat($('#bpmUp'),1);

/* ================= ideas: presets, generate, surprise ================= */
function startIfIdle(){ if(!playing) play(); }
function applyPreset(i){
  const p=PRESETS[i];
  st.nSteps=p.d.length;
  st.steps=p.d.map(d=>({t:'c',d,ext:p.e||0,sus:0}));
  while(st.steps.length<8) st.steps.push(null);
  st.sel=0;loopDirty=true;progChanged();refreshAll();startIfIdle();
  toast(p.n+' LOADED');
}
$('#presetGrid').addEventListener('click',e=>{ const b=e.target.closest('[data-preset]'); if(b) applyPreset(+b.dataset.preset); });
$('#bGen').addEventListener('click',()=>{
  genProg(st.spice);loopDirty=true;progChanged();refreshAll();startIfIdle();toast('NEW PROGRESSION');
});
$('#bSurprise').addEventListener('click',()=>{
  const Ly=st.layers;
  st.mode=pick([0,0,1,1,2,3,4,6]);st.key=rnd(12);
  st.bpm=70+rnd(56);st.swing=pick([0,0,1,2]);
  st.spice=rnd(3);genProg(st.spice);
  Ly.chords.on=1;Ly.chords.voice=rnd(3);Ly.chords.rhythm=rnd(C_RHYTHMS.length);Ly.chords.strum=rnd(3);
  Ly.bass.on=Math.random()<.85?1:0;Ly.bass.pattern=rnd(B_PATTERNS.length);Ly.bass.voice=rnd(3);
  Ly.arp.on=Math.random()<.7?1:0;Ly.arp.pattern=rnd(A_PATTERNS.length);Ly.arp.rate=pick([1,1,2,3,3]);Ly.arp.oct=1+rnd(3);Ly.arp.gate=rnd(4);Ly.arp.voice=rnd(3);
  Ly.mel.on=Math.random()<.5?1:0;Ly.mel.density=rnd(3);Ly.mel.voice=rnd(3);
  if(Ly.mel.on) genMelody();
  lastCentroid=null;loopDirty=true;refreshAll();
  startIfIdle();
  toast('NEW IDEA');
});
$('#bMel').addEventListener('click',()=>{
  st.layers.mel.on=1;genMelody();loopDirty=true;refreshAll();startIfIdle();toast('NEW MELODY');
});

/* ================= clipboard, clear ================= */
function flash(btn,txt,ms,restore){ btn.textContent=txt; clearTimeout(btn._t); btn._t=setTimeout(()=>{ btn.textContent=restore(); btn.classList.remove('arm'); },ms||1600); }
let clrArmed=false;
$('#clr').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(!clrArmed){ clrArmed=true;b.classList.add('arm'); flash(b,'TAP AGAIN TO CLEAR',2000,()=>{clrArmed=false;return 'CLEAR PROGRESSION';}); return; }
  clrArmed=false;b.classList.remove('arm');
  st.steps=[null,null,null,null,null,null,null,null];st.sel=0;st.layers.mel.notes=[];loopDirty=true;refreshAll();
  flash(b,'CLEARED',1200,()=>'CLEAR PROGRESSION');
});
function progressionText(){
  const parts=[];
  for(let i=0;i<st.nSteps;i++){ const t=stepText(st.steps[i]); parts.push(t.empty?'-':t.nm); }
  return parts.join(' | ');
}
$('#copy').addEventListener('click',async e=>{
  const btn=e.currentTarget,txt=progressionText();
  let ok=false;
  try{ await navigator.clipboard.writeText(txt); ok=true; }catch(err){}
  if(!ok){
    try{
      const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0;left:-999px';
      document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove();
    }catch(err){}
  }
  flash(btn,ok?'COPIED':'COPY BLOCKED',1400,()=>'COPY CHORDS AS TEXT');
});

/* ================= MIDI export ================= */
const be16=n=>[(n>>8)&255,n&255];
const be32=n=>[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];
const le16=n=>[n&255,(n>>8)&255];
const le32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
const ascii=t=>Array.from(t).map(c=>c.charCodeAt(0)&0x7f);
const vlq=n=>{n=Math.max(0,Math.round(n));const b=[n&0x7f];while((n>>=7)>0) b.unshift((n&0x7f)|0x80);return b;};
const metaText=(type,t)=>[0xFF,type,t.length].concat(ascii(t));
function trackChunk(events,endTick){
  events.sort((a,b)=>a.tick-b.tick||a.order-b.order);
  const out=[];let last=0;
  for(const e of events){ out.push(...vlq(e.tick-last),...e.bytes); last=e.tick; }
  out.push(...vlq(Math.max(0,endTick-last)),0xFF,0x2F,0x00);
  return [77,84,114,107].concat(be32(out.length),out);
}
const SF={0:0,7:1,2:2,9:3,4:4,11:5,6:6,5:-1,10:-2,3:-3,8:-4,1:-5};
function midiFile(lp,layers,reps){
  const PPQ=480,mn=MODES[st.mode],total=lp.total,endTick=Math.round(total*reps*PPQ);
  const parent=((st.key-mn.p)%12+12)%12;
  const cond=[
    {tick:0,order:0,bytes:metaText(0x03,'CH-1 '+spell(st.key)+' '+mn.name)},
    {tick:0,order:0,bytes:[0xFF,0x51,3].concat(be32(Math.round(60000000/st.bpm)).slice(1))},
    {tick:0,order:0,bytes:[0xFF,0x58,4,4,2,24,8]},
    {tick:0,order:0,bytes:[0xFF,0x59,2,(SF[parent]||0)&255,mn.p===9?1:0]}
  ];
  const jit=HUM_MS[st.human]*st.bpm*PPQ/60000;
  const tracks=[trackChunk(cond,endTick)];
  layers.forEach(k=>{
    const ch=LAYER_KEYS.indexOf(k),L=st.layers[k];
    const tr=[{tick:0,order:0,bytes:metaText(0x03,LAYER_N[k][0]+LAYER_N[k].slice(1).toLowerCase())},{tick:0,order:1,bytes:[0xC0|ch,GM[k][L.voice]]}];
    const vm=[.75,1,1.15][L.vol];
    for(let r=0;r<reps;r++){
      lp.ev.filter(e=>e.layer===k).forEach(e=>{
        let on=Math.round((e.beat+r*total)*PPQ),off=Math.round((e.beat+e.dur+r*total)*PPQ);
        if(jit) on+=Math.round((Math.random()*2-1)*jit);
        on=Math.max(on,0);off=Math.max(off,on+10);
        if(on>=endTick) return;
        off=Math.min(off,endTick);
        let v=Math.round(e.vel*vm);if(st.human) v+=rnd(9)-4;
        v=Math.max(1,Math.min(127,v));
        tr.push({tick:on,order:3,bytes:[0x90|ch,e.note,v]},{tick:off,order:2,bytes:[0x80|ch,e.note,0]});
      });
    }
    tracks.push(trackChunk(tr,endTick));
  });
  const head=[77,84,104,100].concat(be32(6),be16(1),be16(tracks.length),be16(PPQ));
  return Uint8Array.from(head.concat(...tracks));
}
function activeLayers(lp){ return LAYER_KEYS.filter(k=>st.layers[k].on&&lp.ev.some(e=>e.layer===k)); }
function buildMidi(){
  const lp=buildLoop(),ls=activeLayers(lp);
  if(!ls.length) return null;
  return midiFile(lp,ls,st.reps);
}
function renderSummary(){
  const lp=buildLoop(),ls=activeLayers(lp),beats=lp.total*st.reps,secs=Math.round(beats*60/st.bpm);
  const names=ls.map(k=>LAYER_N[k]).join(', ')||'NOTHING YET';
  $('#sum').innerHTML='<div><span>KEY</span><b>'+spell(st.key)+' '+MODES[st.mode].name+'</b></div>'+
    '<div><span>TEMPO</span><b>'+st.bpm+' BPM</b></div>'+
    '<div><span>LENGTH</span><b>'+(beats/4)+' BARS · '+secs+' S</b></div>'+
    '<div><span>TRACKS</span><b>'+names+'</b></div>'+
    '<div><span>CHORDS</span><b>'+progressionText().replace(/\|/g,'·')+'</b></div>';
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++) c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(files){
  const te=new TextEncoder(),d=new Date();
  const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF;
  const dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const parts=[],cd=[];let off=0;
  for(const f of files){
    const nm=te.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=Uint8Array.from([0x50,0x4b,3,4,...le16(20),...le16(0x0800),...le16(0),...le16(dt),...le16(dd),...le32(crc),...le32(sz),...le32(sz),...le16(nm.length),...le16(0)]);
    parts.push(lh,nm,f.data);
    cd.push(Uint8Array.from([0x50,0x4b,1,2,...le16(20),...le16(20),...le16(0x0800),...le16(0),...le16(dt),...le16(dd),...le32(crc),...le32(sz),...le32(sz),...le16(nm.length),...le16(0),...le16(0),...le16(0),...le16(0),...le32(0),...le32(off)]),nm);
    off+=lh.length+nm.length+sz;
  }
  const cdSize=cd.reduce((a,x)=>a+x.length,0);
  const end=Uint8Array.from([0x50,0x4b,5,6,0,0,0,0,...le16(files.length),...le16(files.length),...le32(cdSize),...le32(off),0,0]);
  return new Blob(parts.concat(cd,[end]),{type:'application/zip'});
}
let dlPromise=null;
function getDownloads(){
  if(!dlPromise){
    let p=null;
    try{ if(window.claude&&window.claude.use) p=window.claude.use('downloads'); }catch(e){}
    dlPromise=p?Promise.race([Promise.resolve(p).catch(()=>null),new Promise(r=>setTimeout(()=>r(null),5000))]):Promise.resolve(null);
  }
  return dlPromise;
}
function exportName(){
  const key=spell(st.key).replace('#','sharp');
  return 'CH-1 '+key+' '+MODES[st.mode].short.toLowerCase().replace('.','')+' '+st.bpm+'bpm';
}
let exporting=false;
async function exportMidi(){
  if(exporting) return;
  const lp=buildLoop(),ls=activeLayers(lp);
  if(!ls.length){ toast('TURN A LAYER ON AND ADD CHORDS FIRST'); return; }
  exporting=true;
  const base=exportName();
  try{
    const files=[{name:base+'.mid',data:midiFile(lp,ls,st.reps)}];
    if(st.stems) ls.forEach(k=>files.push({name:base+' '+LAYER_N[k].toLowerCase()+'.mid',data:midiFile(lp,[k],st.reps)}));
    const dl=await getDownloads();
    if(dl){
      const txt='CH-1 Chord Forge\r\nKey: '+spell(st.key)+' '+MODES[st.mode].name+'\r\nTempo: '+st.bpm+' BPM\r\nStep size: '+st.len+' beat(s)\r\nLayers: '+ls.map(k=>LAYER_N[k]).join(', ')+'\r\n\r\n'+progressionText()+'\r\n';
      const zip=makeZip(files.concat([{name:base+' chords.txt',data:new TextEncoder().encode(txt)}]));
      try{ await dl.save({filename:base+'.zip',data:zip}); toast('SAVED. TAP THE ZIP IN FILES TO UNZIP'); }
      catch(e){ toast(e&&e.code==='declined'?'EXPORT CANCELLED':'SAVE NOT AVAILABLE HERE'); }
      return;
    }
    const fl=files.map(f=>new File([f.data],f.name,{type:'audio/midi'}));
    try{
      if(navigator.canShare&&navigator.canShare({files:fl})){ await navigator.share({files:fl,title:base}); toast('SHARED'); return; }
    }catch(e){ if(e&&e.name==='AbortError'){ toast('EXPORT CANCELLED'); return; } }
    fl.forEach((f,i)=>setTimeout(()=>{
      const url=URL.createObjectURL(f);
      const a=document.createElement('a');a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
    },i*300));
    toast('DOWNLOADING '+fl.length+' FILE'+(fl.length>1?'S':''));
  } finally { exporting=false; }
}
$('#bExport').addEventListener('click',exportMidi);

/* ================= wiring ================= */
function refreshAll(){
  renderTune();renderPads();renderBound();renderSteps();
  if(!held.size&&!playing) showIdle();
  if(st.tab==='export') renderSummary();
  save();
}
document.addEventListener('pointerdown',()=>{ if(!ctx||ctx.state!=='running') ensureAudio(); },{capture:true});

refreshAll();baseMsg();
setTab(st.tab);
setTimeout(getDownloads,0);
requestAnimationFrame(frame);
window.__ch1={st,buildChord,voiceChord,buildLoop,buildMidi,midiFile,makeZip,genMelody,genProg,setTab};
})();
