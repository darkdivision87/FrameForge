<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#D2D6DB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CH-1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>CH-1 Chord Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Chivo+Mono:wght@400;600&display=swap">
<style>
/* Layout concept: one-screen hardware unit. LCD on top, 4x2 pad bank in the middle (it absorbs spare height), modifiers and an 8-step sequencer below. Single look by choice: a pale aluminium shell with one ember accent that only ever means "active". */
:root{
  --shell:#D2D6DB;
  --well:#C0C5CC;
  --cap:#EEF0F3;
  --cap-lo:#DADEE3;
  --edge:#A2A8B1;
  --ink:#181B1F;
  --ink-2:#4F565F;
  --lcd:#C5CEC1;
  --lcd-lo:#B2BCAE;
  --lcd-ink:#1B241D;
  --lcd-dim:#6B786D;
  --ember:#EF4E1C;
  --ember-lo:#C63A10;
  --on-ember:#FFFFFF;
  --f-lcd:'Chivo Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-label:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-y:auto}
body{
  margin:0;background:var(--shell);color:var(--ink);font-family:var(--f-label);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.device{height:100%;min-height:650px;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px 12px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:30px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:30px;line-height:1;font-weight:700;letter-spacing:.02em}
.brand span{font-size:12px;font-weight:600;letter-spacing:.22em;color:var(--ink-2)}
.sig{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--ink-2);text-transform:uppercase;min-width:0}
.sig i{width:9px;height:9px;border-radius:50%;background:var(--edge);box-shadow:inset 0 1px 1px rgba(0,0,0,.25);flex:none}
.sig.live i{background:var(--ember);box-shadow:0 0 0 3px rgba(239,78,28,.22)}

/* LCD */
.lcd{background:var(--lcd);border-radius:12px;padding:9px 12px 10px;color:var(--lcd-ink);font-family:var(--f-lcd);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.7);display:flex;flex-direction:column;gap:5px}
.lcd-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lcd-dim);font-weight:600}
.lcd-top .msg{flex:1;text-align:center;color:var(--lcd-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lcd-top .msg.rec{color:var(--ember-lo)}
.lcd-main{display:flex;align-items:baseline;gap:12px;min-height:60px}
.lcd-main .roman{font-size:20px;font-weight:600;color:var(--lcd-dim);min-width:2.4ch;font-variant-numeric:tabular-nums}
.lcd-main .chord{font-size:54px;line-height:1.05;font-weight:600;letter-spacing:-.03em;white-space:nowrap;min-width:0}
.lcd-notes{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;letter-spacing:.14em;min-height:18px}
.lcd-notes span:last-child{color:var(--lcd-dim);letter-spacing:.08em;font-size:11px;align-self:center;white-space:nowrap}
.kb{position:relative;height:34px;display:flex;border:1px solid var(--lcd-dim);border-radius:3px;overflow:hidden;background:var(--lcd-lo)}
.kb .w{flex:1;background:var(--lcd);border-left:1px solid var(--lcd-dim)}
.kb .w:first-child{border-left:0}
.kb .w.on{background:var(--ember)}
.kb .b{position:absolute;top:0;height:60%;width:3.3%;transform:translateX(-50%);background:var(--lcd-ink);border-radius:0 0 2px 2px}
.kb .b.on{background:var(--ember-lo);box-shadow:0 0 0 1px var(--lcd-ink)}
.kb .c{position:absolute;bottom:1px;font-size:8px;line-height:1;color:var(--lcd-dim);transform:translateX(-50%);pointer-events:none}

/* pads */
.pads{flex:1 1 auto;min-height:150px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:8px}
.pad{position:relative;border:0;border-radius:14px;padding:0;min-width:0;
  background:linear-gradient(180deg,var(--cap),var(--cap-lo));
  box-shadow:0 4px 0 var(--edge),0 8px 12px -6px rgba(0,0,0,.35),inset 0 1px 0 #fff;color:var(--ink);transition:transform .04s}
.pad .rn{position:absolute;left:10px;top:8px;font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--ink-2)}
.pad .nm{position:absolute;left:10px;right:6px;bottom:8px;text-align:left;font-size:27px;line-height:1;font-weight:700;letter-spacing:-.005em;white-space:nowrap;overflow:hidden}
.pad .nm.sm{font-size:21px}
.pad .nm.xs{font-size:17px}
.pad .led{position:absolute;right:9px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--edge);box-shadow:inset 0 1px 1px rgba(0,0,0,.3)}
.pad.on{background:var(--ember);color:var(--on-ember);transform:translateY(4px);box-shadow:0 0 0 var(--edge),inset 0 3px 6px rgba(0,0,0,.3)}
.pad.on .rn{color:var(--on-ember);opacity:.85}
.pad.on .led{background:var(--on-ember);box-shadow:none}
.pad.tie{background:transparent;box-shadow:inset 0 0 0 2px var(--edge)}
.pad.tie[aria-disabled="true"]{opacity:.55}
.pad.tie.on{background:var(--ink);color:var(--cap);box-shadow:none}

/* sequencer */
.seq{display:flex;flex-direction:column;gap:8px;background:var(--well);border-radius:14px;padding:8px}
.transport{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}
.key{height:46px;border:0;border-radius:10px;background:linear-gradient(180deg,var(--cap),var(--cap-lo));box-shadow:0 3px 0 var(--edge),inset 0 1px 0 #fff;font-size:17px;font-weight:700;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;gap:8px;padding:0}
.key:active{transform:translateY(3px);box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.key .dot{width:11px;height:11px;border-radius:50%;background:var(--ember)}
.key[aria-pressed="true"]{background:var(--ember);color:var(--on-ember);transform:translateY(3px);box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.key[aria-pressed="true"] .dot{background:var(--on-ember)}
.key .tri{width:0;height:0;border-left:12px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent}
.key .sq{width:11px;height:11px;background:currentColor;border-radius:2px}
.bpm{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;background:var(--shell);border-radius:10px;height:46px;padding:0 3px;gap:2px}
.bpm button{height:40px;border:0;background:transparent;font-size:22px;font-weight:600;border-radius:8px;padding:0}
.bpm button:active{background:var(--cap-lo)}
.bpm .val{text-align:center;line-height:1}
.bpm small{display:block;font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--ink-2);margin-bottom:2px}
.bpm b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.steps{display:grid;gap:6px}
.step{position:relative;height:56px;border:0;border-radius:9px;background:var(--shell);padding:0;min-width:0;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--edge)}
.step .n{position:absolute;left:5px;top:4px;font-size:10px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.step .nm{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:17px;font-weight:700;line-height:1;white-space:nowrap;overflow:hidden}
.step .nm.sm{font-size:13px}
.step .rr{position:absolute;left:0;right:0;top:15px;text-align:center;font-size:11px;font-weight:600;color:var(--ink-2)}
.step.empty .nm{color:var(--edge);font-weight:600}
.step.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.step.now{background:var(--ember);color:var(--on-ember);box-shadow:none}
.step.now .n,.step.now .rr{color:var(--on-ember)}
.step.sel.now{box-shadow:inset 0 0 0 3px var(--ink)}

/* chord size, on the main screen */
.seg{display:flex;flex-direction:column;gap:4px;min-width:0}
.seg>span{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--ink-2)}
.seg .row{display:flex;background:var(--well);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;height:44px;border:0;border-radius:9px;background:transparent;font-size:16px;font-weight:600;letter-spacing:.06em;color:var(--ink-2);padding:0 2px}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--cap),var(--cap-lo));color:var(--ink);box-shadow:0 2px 0 var(--edge),inset 0 1px 0 #fff}

/* bottom bar */
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bb{height:54px;border:0;border-radius:12px;min-width:0;padding:0 3px;background:linear-gradient(180deg,var(--cap),var(--cap-lo));box-shadow:0 3px 0 var(--edge),inset 0 1px 0 #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.bb small{font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--ink-2)}
.bb b{font-size:15px;font-weight:700;letter-spacing:.03em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bb:active{transform:translateY(3px);box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.bb.go{background:var(--ink);color:var(--cap);box-shadow:0 3px 0 #000}
.bb.go small{color:#9AA1AB}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(24,27,31,.5)}
.panel{position:relative;width:100%;max-width:440px;max-height:88%;overflow-y:auto;background:var(--shell);border-radius:22px 22px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -12px 32px rgba(0,0,0,.3);animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel h2{margin:0;font-size:24px;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.done{height:44px;min-width:84px;border:0;border-radius:12px;background:var(--ink);color:var(--cap);font-size:17px;font-weight:700;letter-spacing:.06em;padding:0 16px}
.group{display:flex;flex-direction:column;gap:14px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--ink-2);margin-bottom:-6px}
.grid4,.grid2{display:grid;gap:8px}
.grid4{grid-template-columns:repeat(4,1fr)}
.grid2{grid-template-columns:1fr 1fr}
.opt{height:54px;border:0;border-radius:12px;min-width:0;padding:0 4px;background:linear-gradient(180deg,var(--cap),var(--cap-lo));box-shadow:0 3px 0 var(--edge),inset 0 1px 0 #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:21px;font-weight:700}
.opt small{font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:.06em;min-height:11px}
.opt.scale{align-items:flex-start;padding:0 12px;font-size:19px;letter-spacing:.03em}
.opt[aria-pressed="true"]{background:var(--ember);color:var(--on-ember);transform:translateY(3px);box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.opt[aria-pressed="true"] small{color:var(--on-ember);opacity:.9}
.panel .seg button{height:48px;font-size:17px}
.act{height:52px;width:100%;border:0;border-radius:12px;background:linear-gradient(180deg,var(--cap),var(--cap-lo));box-shadow:0 3px 0 var(--edge),inset 0 1px 0 #fff;font-size:17px;font-weight:700;letter-spacing:.08em;padding:0 8px}
.act:active{transform:translateY(3px);box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.act.arm{background:var(--ink);color:var(--cap)}

@media (max-height:740px){
  .lcd-main{min-height:50px}.lcd-main .chord{font-size:46px}
  .kb{height:28px}.step{height:52px}.key{height:42px}.bpm{height:42px}
  .seg button{height:40px}.bb{height:48px}
}
@media (prefers-reduced-motion:reduce){.pad{transition:none}.panel{animation:none}}
</style>

<main class="device" id="device">
  <header class="top">
    <div class="brand"><b>CH-1</b><span>CHORD FORGE</span></div>
    <div class="sig" id="sig"><i></i><span id="sigTxt">Tap a pad to wake</span></div>
  </header>

  <section class="lcd" aria-label="Display">
    <div class="lcd-top"><span id="lcdKey">C MAJOR</span><span class="msg" id="lcdMsg"></span><span id="lcdBpm">88 BPM</span></div>
    <div class="lcd-main" aria-live="polite"><span class="roman" id="lcdRoman">I</span><span class="chord" id="lcdChord">C</span></div>
    <div class="lcd-notes"><span id="lcdNotes">C  E  G</span><span id="lcdInv">READY</span></div>
    <div class="kb" id="kb" aria-hidden="true"></div>
  </section>

  <section class="pads" id="pads" aria-label="Chord pads"></section>

  <div class="seg" data-seg="ext"><div class="row" role="group" aria-label="Chord size">
    <button type="button" data-v="0" aria-pressed="true">TRIAD</button><button type="button" data-v="1" aria-pressed="false">7TH</button><button type="button" data-v="2" aria-pressed="false">9TH</button></div></div>

  <section class="seq" aria-label="Progression sequencer">
    <div class="transport">
      <button type="button" class="key" id="rec" aria-pressed="false"><span class="dot"></span>REC</button>
      <button type="button" class="key" id="play" aria-pressed="false"><span class="tri" id="playIcon"></span><span id="playTxt">PLAY</span></button>
      <div class="bpm">
        <button type="button" id="bpmDn" aria-label="Slower">&#8722;</button>
        <div class="val"><small>TEMPO</small><b id="bpmVal">88</b></div>
        <button type="button" id="bpmUp" aria-label="Faster">+</button>
      </div>
    </div>
    <div class="steps" id="steps" role="group" aria-label="Steps"></div>
  </section>

  <nav class="bar" aria-label="Settings and export">
    <button type="button" class="bb" id="bKey" data-open="key"><small>KEY</small><b id="bbKey">C MAJOR</b></button>
    <button type="button" class="bb" id="bSound" data-open="sound"><small>SOUND</small><b id="bbSound">KEYS</b></button>
    <button type="button" class="bb" id="bLoop" data-open="loop"><small>LOOP</small><b id="bbLoop">4 STEPS</b></button>
    <button type="button" class="bb go" id="bExport"><small>EXPORT</small><b>MIDI</b></button>
  </nav>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <header><h2 id="shTitle">Settings</h2><button type="button" class="done" id="shDone">Done</button></header>

    <div class="group" data-sheet="key" hidden>
      <div class="lbl">KEY</div><div class="grid4" id="keyGrid"></div>
      <div class="lbl">SCALE</div><div class="grid2" id="scaleGrid"></div>
    </div>

    <div class="group" data-sheet="sound" hidden>
      <div class="seg" data-seg="voice"><span>SOUND</span><div class="row" role="group" aria-label="Sound">
        <button type="button" data-v="0" aria-pressed="true">KEYS</button><button type="button" data-v="1" aria-pressed="false">PAD</button><button type="button" data-v="2" aria-pressed="false">PLUCK</button></div></div>
      <div class="seg" data-seg="style"><span>PLAY STYLE</span><div class="row" role="group" aria-label="Play style">
        <button type="button" data-v="0" aria-pressed="false">BLOCK</button><button type="button" data-v="1" aria-pressed="true">STRUM</button><button type="button" data-v="2" aria-pressed="false">ARP</button></div></div>
      <div class="seg" data-seg="sus"><span>SUSPEND</span><div class="row" role="group" aria-label="Suspension">
        <button type="button" data-v="0" aria-pressed="true">OFF</button><button type="button" data-v="2" aria-pressed="false">SUS2</button><button type="button" data-v="4" aria-pressed="false">SUS4</button></div></div>
    </div>

    <div class="group" data-sheet="loop" hidden>
      <div class="seg" data-seg="nSteps"><span>LENGTH</span><div class="row" role="group" aria-label="Number of steps">
        <button type="button" data-v="4" aria-pressed="true">4 STEPS</button><button type="button" data-v="8" aria-pressed="false">8 STEPS</button></div></div>
      <div class="seg" data-seg="len"><span>STEP SIZE</span><div class="row" role="group" aria-label="Beats per step">
        <button type="button" data-v="1" aria-pressed="false">1 BEAT</button><button type="button" data-v="2" aria-pressed="false">2 BEATS</button><button type="button" data-v="4" aria-pressed="true">4 BEATS</button></div></div>
      <button type="button" class="act" id="del">DELETE STEP</button>
      <button type="button" class="act" id="clr">CLEAR ALL STEPS</button>
      <button type="button" class="act" id="copy">COPY CHORDS AS TEXT</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

/* ---------- theory ---------- */
const NOTE_S=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_F=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const MODES=[
  {name:'MAJOR',   short:'MAJOR', hint:'bright',    s:[0,2,4,5,7,9,11],p:0},
  {name:'MINOR',   short:'MINOR', hint:'dark',      s:[0,2,3,5,7,8,10],p:9},
  {name:'DORIAN',  short:'DORIAN',hint:'soulful',   s:[0,2,3,5,7,9,10],p:2},
  {name:'MIXOLYDIAN',short:'MIXO',hint:'bluesy',    s:[0,2,4,5,7,9,10],p:7},
  {name:'LYDIAN',  short:'LYDIAN',hint:'dreamy',    s:[0,2,4,6,7,9,11],p:5},
  {name:'PHRYGIAN',short:'PHRYG', hint:'spanish',   s:[0,1,3,5,7,8,10],p:4},
  {name:'HARMONIC MINOR',short:'H.MIN',hint:'dramatic',s:[0,2,3,5,7,8,11],p:9}
];
const ROMAN=['I','II','III','IV','V','VI','VII'];
const VOICES=['keys','pad','pluck'];
const STYLES=['block','strum','arp'];
const LEN_OPTS=[1,2,4];
const LO=48, HI=83; // keyboard range C3..B5

const DEFAULTS={key:0,mode:0,ext:0,sus:0,voice:0,style:1,bpm:88,len:4,nSteps:4,sel:0,
  steps:[{t:'c',d:5,ext:0,sus:0},{t:'c',d:3,ext:0,sus:0},{t:'c',d:0,ext:0,sus:0},{t:'c',d:4,ext:0,sus:0},null,null,null,null]};

function load(){
  const s=JSON.parse(JSON.stringify(DEFAULTS));
  try{
    const r=JSON.parse(localStorage.getItem('ch1.v1')||'null');
    if(!r) return s;
    const num=(k,lo,hi)=>{ if(Number.isInteger(r[k])&&r[k]>=lo&&r[k]<=hi) s[k]=r[k]; };
    num('key',0,11);num('mode',0,MODES.length-1);num('ext',0,2);num('voice',0,2);num('style',0,2);num('bpm',50,180);num('sel',0,7);
    if([0,2,4].includes(r.sus)) s.sus=r.sus;
    if(LEN_OPTS.includes(r.len)) s.len=r.len;
    if(r.nSteps===4||r.nSteps===8) s.nSteps=r.nSteps;
    if(Array.isArray(r.steps)&&r.steps.length===8){
      s.steps=r.steps.map(x=>{
        if(x&&x.t==='tie') return {t:'tie'};
        if(x&&x.t==='c'&&Number.isInteger(x.d)&&x.d>=0&&x.d<7) return {t:'c',d:x.d,ext:[0,1,2].includes(x.ext)?x.ext:0,sus:[0,2,4].includes(x.sus)?x.sus:0};
        return null;
      });
    }
  }catch(e){}
  return s;
}
const st=load();
st.rec=false;
function save(){

function useFlats(){ const p=((st.key-MODES[st.mode].p)%12+12)%12; return [5,10,3,8,1].includes(p); }
const spell=pc=>(useFlats()?NOTE_F:NOTE_S)[((pc%12)+12)%12];

function suffixFor(th,fi,sv,has9){
  const T={
    '4-7':{n:'',10:'7',11:'maj7',9:'6'},
    '3-7':{n:'m',10:'m7',11:'m(maj7)',9:'m6'},
    '3-6':{n:'dim',9:'dim7',10:'m7b5',11:'dim(maj7)'},
    '4-8':{n:'aug',10:'7#5',11:'maj7#5',9:'aug6'},
    '4-6':{n:'b5',10:'7b5',11:'maj7b5',9:'6b5'}
  };
  const row=T[th+'-'+fi]||{n:'?'};
  let s=sv===undefined?row.n:(row[sv]!==undefined?row[sv]:'');
  if(has9&&sv!==undefined){ s=/6$/.test(s)?s+'/9':s.replace('7','9'); }
  return s;
}
function buildChord(c){
  const S=MODES[st.mode].s;
  const deg=i=>{const x=c.d+i;return S[x%7]+12*Math.floor(x/7);};
  const base=deg(0);
  const ks=[0,c.sus===2?1:c.sus===4?3:2,4];
  if(c.ext>=1) ks.push(6);
  if(c.ext>=2&&c.sus!==2) ks.push(8);
  const iv=ks.map(k=>deg(k)-base);
  const rootPc=(st.key+S[c.d])%12;
  const th=iv[1],fi=iv[2],sv=iv[3],has9=iv.length>4;
  let name;
  if(c.sus){
    const sx=c.sus===2?'sus2':'sus4';
    let q='';
    if(sv!==undefined) q=has9?(sv===11?'maj9':sv===10?'9':'6/9'):(sv===11?'maj7':sv===10?'7':'6');
    name=spell(rootPc)+q+sx;
  } else name=spell(rootPc)+suffixFor(th,fi,sv,has9);
  let rn=ROMAN[c.d];
  if(!c.sus&&th===3) rn=rn.toLowerCase();
  if(!c.sus&&th===3&&fi===6) rn+='°';
  if(!c.sus&&fi===8) rn+='+';
  const tag=(c.ext===1?'7':c.ext===2?'9':'')+(c.sus?'s'+c.sus:'');
  return {iv,rootPc,name,roman:rn,tag};
}

let lastCentroid=null;
function chooseVoicing(iv,rootPc){
  const target=lastCentroid==null?62:lastCentroid*0.7+62*0.3;
  let best=null;
  for(let inv=0;inv<iv.length;inv++){
    for(const oct of [0,12]){
      const notes=iv.map((x,j)=>LO+rootPc+x+(j<inv?12:0)+oct).sort((a,b)=>a-b);
      if(notes[0]<LO||notes[notes.length-1]>HI) continue;
      const cen=notes.reduce((a,b)=>a+b,0)/notes.length;
      const span=notes[notes.length-1]-notes[0];
      const score=Math.abs(cen-target)+(span>17?2:0);
      if(!best||score<best.score) best={notes,inv,cen,score};
    }
  }
  return best;
}
function voiceChord(c){
  const b=buildChord(c);
  const v=chooseVoicing(b.iv,b.rootPc);
  lastCentroid=v.cen;
  return Object.assign({},b,{notes:v.notes,inv:v.inv,bass:36+b.rootPc});
}

/* ---------- audio ---------- */
let ctx=null,bus=null,unlocked=false;
function impulse(c,sec,decay){
  const len=Math.floor(c.sampleRate*sec),buf=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
  return buf;
}
function silentWav(){
  const n=800,sr=8000,buf=new ArrayBuffer(44+n),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i,128);
  let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]);
  return 'data:audio/wav;base64,'+btoa(s);
}
function unlockIOS(){
  if(unlocked) return; unlocked=true;
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  try{ const a=new Audio(silentWav()); a.loop=true; a.volume=0.05; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
}
function ensureAudio(){
  if(ctx){ if(ctx.state!=='running'){ try{ctx.resume();}catch(e){} } return ctx; }
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  try{ ctx=new AC({latencyHint:'interactive'}); }catch(e){ try{ ctx=new AC(); }catch(e2){ return null; } }
  const master=ctx.createGain(); master.gain.value=0.9;
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-16;comp.knee.value=18;comp.ratio.value=4;comp.attack.value=0.004;comp.release.value=0.22;
  bus=ctx.createGain(); bus.gain.value=0.75; bus.connect(master);
  const conv=ctx.createConvolver(); conv.buffer=impulse(ctx,2.4,2.6);
  const wet=ctx.createGain(); wet.gain.value=0.26; bus.connect(conv); conv.connect(wet); wet.connect(master);
  master.connect(comp); comp.connect(ctx.destination);
  try{ ctx.resume(); }catch(e){}
  unlockIOS();
  ctx.onstatechange=updateSig;
  updateSig();
  return ctx;
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const safeStop=(o,t)=>{ try{o.stop(t);}catch(e){} };

/* One note. Returns {release(t)}. Envelope lives in `env`; release lives in `out`, so a note can be cut at any time. */
function playNote(m,t,vel,kind,isBass){
  const f=mtof(m),out=ctx.createGain(),env=ctx.createGain(),oscs=[];
  out.connect(bus);env.connect(out);
  let relTc=0.12,life=7;
  const mk=(type,freq,det)=>{const o=ctx.createOscillator();o.type=type;o.frequency.value=freq;if(det) o.detune.value=det;oscs.push(o);return o;};
  if(isBass){
    const o=mk('sine',f);o.connect(env);
    const pk=0.26*vel;
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(pk,t+(kind==='pad'?0.2:0.01));
    if(kind==='pad'){relTc=0.4;life=60;} else env.gain.setTargetAtTime(pk*0.35,t+0.02,0.9);
  } else if(kind==='keys'){
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;lp.Q.value=0.4;lp.connect(env);
    const a=mk('triangle',f);a.connect(lp);
    const bg=ctx.createGain();bg.gain.setValueAtTime(0.5*vel,t);bg.gain.setTargetAtTime(0,t,0.1);
    const b=mk('sine',f*2);b.connect(bg);bg.connect(lp);
    const pk=0.22*vel;
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(pk,t+0.006);
    env.gain.setTargetAtTime(pk*0.45,t+0.006,0.55);
    env.gain.setTargetAtTime(0.0001,t+1.6,2.2);
    relTc=0.14;
  } else if(kind==='pad'){
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=0.6;
    lp.frequency.setValueAtTime(380,t);lp.frequency.linearRampToValueAtTime(1500,t+0.7);lp.connect(env);
    mk('sawtooth',f,-7).connect(lp);mk('sawtooth',f,7).connect(lp);
    const pk=0.075*vel;
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(pk,t+0.22);
    relTc=0.4;life=60;
  } else {
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=1.2;
    lp.frequency.setValueAtTime(4600,t);lp.frequency.setTargetAtTime(520,t,0.11);lp.connect(env);
    mk('sawtooth',f).connect(lp);mk('triangle',f/2).connect(lp);
    const pk=0.2*vel;
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(pk,t+0.004);
    env.gain.setTargetAtTime(0.0001,t+0.01,0.34);
    relTc=0.08;life=4;
  }
  oscs.forEach(o=>{o.start(t);safeStop(o,t+life);});
  let relT=Infinity;
  return {
    release(tr){
      const now=ctx.currentTime;
      tr=Math.max(tr,now,t);
      if(tr>=relT) return;
      relT=tr;
      try{
        out.gain.cancelScheduledValues(tr);
        out.gain.setTargetAtTime(0,tr,relTc);
      }catch(e){}
      oscs.forEach(o=>safeStop(o,tr+relTc*9));
    }
  };
}

/* A chord. dur=null means held until release(). */
const live=new Set();
function startChord(ch,t,dur){
  const kind=VOICES[st.voice],style=STYLES[st.style];
  const hs=[];
  const h={timer:null,done:false,
    release(tr){
      if(tr===undefined) tr=ctx.currentTime;
      h.done=true;if(h.timer){clearInterval(h.timer);h.timer=null;}
      hs.forEach(x=>x.release(tr));
    }};
  const vel=()=>0.88+Math.random()*0.12;
  hs.push(playNote(ch.bass,t,0.9,kind,true));
  if(style==='arp'){
    const sec=60/st.bpm/4;
    const seq=ch.notes.concat(ch.notes.slice(1,-1).reverse());
    let i=0,nt=t;
    const one=tm=>{const hd=playNote(seq[i%seq.length],tm,vel(),kind);hd.release(tm+sec*0.9);hs.push(hd);i++;};
    if(dur!=null){
      while(nt<t+dur-1e-6){one(nt);nt+=sec;}
    } else {
      h.timer=setInterval(()=>{
        if(h.done||!ctx) return;
        if(nt<ctx.currentTime) nt=ctx.currentTime;
        while(nt<ctx.currentTime+0.12){one(nt);nt+=sec;}
        if(hs.length>200) hs.splice(1,hs.length-100);
      },25);
    }
  } else {
    ch.notes.forEach((m,idx)=>{
      hs.push(playNote(m,t+(style==='strum'?idx*0.032:0),vel(),kind));
    });
  }
  if(dur!=null) h.release(t+dur-0.03);
  live.add(h);
  if(live.size>64){ for(const x of live){ if(x.done){live.delete(x);} } }
  return h;
}

const kbEl=$('#kb'),kbMap={};
(function buildKb(){
  const white=[];let wi=0;
  for(let m=LO;m<=HI;m++){ if(![1,3,6,8,10].includes(m%12)) white.push(m); }
  const W=white.length;
  for(let m=LO;m<=HI;m++){
    const pc=m%12;
    if([1,3,6,8,10].includes(pc)){
      const b=document.createElement('i');b.className='b';b.style.left=(wi/W*100)+'%';kbEl.appendChild(b);kbMap[m]=b;
    } else {
      const w=document.createElement('i');w.className='w';kbEl.appendChild(w);kbMap[m]=w;wi++;
      if(pc===0){const c=document.createElement('span');c.className='c';c.textContent='C'+(Math.floor(m/12)-1);c.style.left=((wi-0.5)/W*100)+'%';kbEl.appendChild(c);}
    }
  }
})();
let litSig='';
function paintKeys(){
  const set=new Set();
  held.forEach(v=>v.notes.forEach(n=>set.add(n)));
  if(seqLit&&ctx&&ctx.currentTime<seqLit.until) seqLit.notes.forEach(n=>set.add(n));
  const sig=Array.from(set).sort().join(',');
  if(sig===litSig) return; litSig=sig;
  for(const m in kbMap) kbMap[m].classList.toggle('on',set.has(+m));
}

const held=new Map(); // id -> {h,notes,pad}
function pressPad(d,id){
  if(held.has(id)) return;
  if(d===7){
    if(!st.rec){ toast('ARM REC TO WRITE TIES'); return; }
    writeStep({t:'tie'});
    padEls[7].classList.add('on');held.set(id,{h:null,notes:[],pad:padEls[7]});
    return;
  }
  if(!ensureAudio()){ toast('NO AUDIO IN THIS BROWSER'); return; }
  const c={t:'c',d,ext:st.ext,sus:st.sus};
  if(st.rec) writeStep(c);
  const ch=voiceChord(c);
  const h=startChord(ch,ctx.currentTime+0.004,null);
  held.set(id,{h,notes:ch.notes,pad:padEls[d]});
  padEls[d].classList.add('on');
  showChord(ch);paintKeys();
}
function releasePad(id){
  const v=held.get(id);if(!v) return;
  held.delete(id);
  if(v.h) v.h.release(ctx.currentTime);
  v.pad.classList.remove('on');
  paintKeys();
}
padEls.forEach((p,d)=>{
  p.addEventListener('pointerdown',e=>{
    e.preventDefault();
    try{p.setPointerCapture(e.pointerId);}catch(err){}
    pressPad(d,'p'+e.pointerId);
  });
  const up=e=>releasePad('p'+e.pointerId);
  p.addEventListener('pointerup',up);
  p.addEventListener('pointercancel',up);
  p.addEventListener('lostpointercapture',up);
  p.addEventListener('contextmenu',e=>e.preventDefault());
});
function releaseAll(){ Array.from(held.keys()).forEach(releasePad); }

const KEYMAP={'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'7':6,'8':7};
document.addEventListener('keydown',e=>{
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(e.key in KEYMAP){ pressPad(KEYMAP[e.key],'k'+e.key); }
  else if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  else if(e.key==='r'||e.key==='R'){ toggleRec(); }
});

function onStepTap(i){

  if(!playing&&c&&c.t==='c'&&ensureAudio()){
    const ch=voiceChord(c);
    const h=startChord(ch,ctx.currentTime+0.004,Math.min(1.2,60/st.bpm*2));
    showChord(ch);
    seqLit={notes:ch.notes,until:ctx.currentTime+Math.min(1.2,60/st.bpm*2)};paintKeys();
  }
  renderSteps();save();
}
function writeStep(c){
  let i;
  if(playing&&curStep>=0&&ctx){
    i=curStep;
    if(curDur>0&&(ctx.currentTime-curStart)/curDur>0.72) i=(curStep+1)%st.nSteps;
  } else i=st.sel;
  st.steps[i]=c;
  if(!playing) st.sel=(i+1)%st.nSteps;
  renderSteps();save();
}
function toggleRec(){
  st.rec=!st.rec;
  const b=$('#rec');b.setAttribute('aria-pressed',String(st.rec));
  padEls[7].setAttribute('aria-disabled',st.rec?'false':'true');
  toast(st.rec?'REC ARMED':'REC OFF',st.rec);
}
$('#rec').addEventListener('click',toggleRec);

function togglePlay(){ playing?stop():play(); }
async function play(){
  if(!ensureAudio()){ toast('NO AUDIO IN THIS BROWSER'); return; }
  playing=true;lastCentroid=null;nextStep=0;nextT=ctx.currentTime+0.08;uiQ=[];curStep=-1;
  seqTimer=setInterval(tick,25);
  $('#play').setAttribute('aria-pressed','true');
  $('#playTxt').textContent='STOP';$('#playIcon').className='sq';
  baseMsg();
  try{ if(navigator.wakeLock) wake=await navigator.wakeLock.request('screen'); }catch(e){}
}
function stop(){
  playing=false;
  clearInterval(seqTimer);seqTimer=null;
  if(ctx){
    const now=ctx.currentTime;
    const byHand=new Set();held.forEach(v=>{ if(v.h) byHand.add(v.h); });
    live.forEach(h=>{ if(!byHand.has(h)) h.release(now); });
    live.clear();byHand.forEach(h=>live.add(h));
  }
  uiQ=[];curStep=-1;seqLit=null;
  $('#play').setAttribute('aria-pressed','false');
  $('#playTxt').textContent='PLAY';$('#playIcon').className='tri';
  try{ if(wake){wake.release();wake=null;} }catch(e){}
  baseMsg();renderSteps();paintKeys();
}
function tick(){
  const stepSec=60/st.bpm*st.len;
  while(nextT<ctx.currentTime+0.15){
    if(nextStep>=st.nSteps) nextStep=0;
    schedStep(nextStep,nextT,stepSec);
    nextT+=stepSec;nextStep=(nextStep+1)%st.nSteps;
  }
}
function schedStep(i,t,stepSec){
  const c=st.steps[i];
  const q={t,i,stepSec,ch:null,until:0};
  if(c&&c.t==='c'){
    let n=1;
    for(let k=1;i+k<st.nSteps;k++){ const x=st.steps[i+k]; if(x&&x.t==='tie') n++; else break; }
    const dur=stepSec*n;
    const ch=voiceChord(c);
    startChord(ch,t,dur);
    q.ch=ch;q.until=t+dur;
  }
  uiQ.push(q);
}
function frame(){
  if(ctx&&uiQ.length){
    const now=ctx.currentTime;
    let hit=null;
    while(uiQ.length&&uiQ[0].t<=now){ hit=uiQ.shift(); }
    if(hit){
      curStep=hit.i;curStart=hit.t;curDur=hit.stepSec;
      if(hit.ch){ showChord(hit.ch); seqLit={notes:hit.ch.notes,until:hit.until-0.02}; }
      $$('.step',stepsEl).forEach((b,i)=>b.classList.toggle('now',i===curStep));
    }
  }
  paintKeys();
  requestAnimationFrame(frame);
}
$('#play').addEventListener('click',togglePlay);

/* tempo with press-and-hold repeat */
function holdRepeat(btn,delta){
  let to=null,iv=null;
  const bump=()=>{ st.bpm=Math.max(50,Math.min(180,st.bpm+delta)); renderTune();save(); };
  const end=()=>{ clearTimeout(to);clearInterval(iv);to=iv=null; };
  btn.addEventListener('pointerdown',e=>{ e.preventDefault(); bump(); to=setTimeout(()=>{ iv=setInterval(bump,70); },380); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,end));
  btn.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); bump(); } });
}
holdRepeat($('#bpmDn'),-1);holdRepeat($('#bpmUp'),1);

/* utilities (inside the Loop sheet; feedback shows on the button itself) */
function flash(btn,txt,ms,restore){ btn.textContent=txt; clearTimeout(btn._t); btn._t=setTimeout(()=>{ btn.textContent=restore(); btn.classList.remove('arm'); },ms||1600); }
let clrArmed=false;
$('#del').addEventListener('click',e=>{ st.steps[st.sel]=null; renderSteps();save(); flash(e.currentTarget,'DELETED',1000,()=>'DELETE STEP '+(st.sel+1)); });
$('#clr').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(!clrArmed){ clrArmed=true;b.classList.add('arm'); flash(b,'TAP AGAIN TO CLEAR',2000,()=>{clrArmed=false;return 'CLEAR ALL STEPS';}); return; }
  clrArmed=false;b.classList.remove('arm');
  st.steps=[null,null,null,null,null,null,null,null];st.sel=0;renderSteps();save();
  flash(b,'CLEARED',1200,()=>'CLEAR ALL STEPS');
});
function progressionText(){
  const parts=[];
  for(let i=0;i<st.nSteps;i++){ const t=stepText(st.steps[i]); parts.push(t.empty?'-':t.nm); }
  return parts.join(' | ');
}
$('#copy').addEventListener('click',async e=>{
  const btn=e.currentTarget,txt=progressionText();
  let ok=false;
  try{ await navigator.clipboard.writeText(txt); ok=true; }catch(err){}
  if(!ok){
    try{
      const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0;left:-999px';
      document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove();
    }catch(err){}
  }
  flash(btn,ok?'COPIED':'COPY BLOCKED',1400,()=>'COPY CHORDS AS TEXT');
});

/* ---------- MIDI export ---------- */
const be16=n=>[(n>>8)&255,n&255];
const be32=n=>[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];
const le16=n=>[n&255,(n>>8)&255];
const le32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
const ascii=t=>Array.from(t).map(c=>c.charCodeAt(0)&0x7f);
const vlq=n=>{const b=[n&0x7f];while((n>>=7)>0) b.unshift((n&0x7f)|0x80);return b;};
const metaText=(type,t)=>[0xFF,type,t.length].concat(ascii(t));
function trackChunk(events,endTick){
  events.sort((a,b)=>a.tick-b.tick||a.order-b.order);
  const out=[];let last=0;
  for(const e of events){ out.push(...vlq(e.tick-last),...e.bytes); last=e.tick; }
  out.push(...vlq(Math.max(0,endTick-last)),0xFF,0x2F,0x00);
  return [77,84,114,107].concat(be32(out.length),out);
}
const SF={0:0,7:1,2:2,9:3,4:4,11:5,6:6,5:-1,10:-2,3:-3,8:-4,1:-5};
function buildMidi(){
  const PPQ=480,stepT=PPQ*st.len;
  const cs=[],saved=lastCentroid;lastCentroid=null;
  for(let i=0;i<st.nSteps;i++){
    const c=st.steps[i];
    if(c&&c.t==='c'){
      let n=1;
      for(let k=1;i+k<st.nSteps;k++){ const x=st.steps[i+k]; if(x&&x.t==='tie') n++; else break; }
      cs.push({i,n,ch:voiceChord(c)});
    }
  }
  lastCentroid=saved;
  if(!cs.length) return null;
  const total=stepT*st.nSteps,mn=MODES[st.mode];
  const parent=((st.key-mn.p)%12+12)%12;
  const cond=[
    {tick:0,order:0,bytes:metaText(0x03,'CH-1 '+spell(st.key)+' '+mn.name)},
    {tick:0,order:0,bytes:[0xFF,0x51,3].concat(be32(Math.round(60000000/st.bpm)).slice(1))},
    {tick:0,order:0,bytes:[0xFF,0x58,4,4,2,24,8]},
    {tick:0,order:0,bytes:[0xFF,0x59,2,(SF[parent]||0)&255,mn.p===9?1:0]}
  ];
  const chord=[{tick:0,order:0,bytes:metaText(0x03,'Chords')},{tick:0,order:1,bytes:[0xC0,[4,89,24][st.voice]]}];
  const bass=[{tick:0,order:0,bytes:metaText(0x03,'Bass')},{tick:0,order:1,bytes:[0xC1,33]}];
  cs.forEach(({i,n,ch})=>{
    const t0=i*stepT,t1=t0+n*stepT;
    ch.notes.forEach(m=>{ chord.push({tick:t0,order:3,bytes:[0x90,m,92]},{tick:t1,order:2,bytes:[0x80,m,0]}); });
    bass.push({tick:t0,order:3,bytes:[0x91,ch.bass,84]},{tick:t1,order:2,bytes:[0x81,ch.bass,0]});
  });
  const head=[77,84,104,100].concat(be32(6),be16(1),be16(3),be16(PPQ));
  return Uint8Array.from(head.concat(trackChunk(cond,total),trackChunk(chord,total),trackChunk(bass,total)));
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++) c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(files){ // stored (no compression), enough for two tiny files
  const te=new TextEncoder(),d=new Date();
  const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF;
  const dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const parts=[],cd=[];let off=0;
  for(const f of files){
    const nm=te.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=Uint8Array.from([0x50,0x4b,3,4,...le16(20),...le16(0x0800),...le16(0),...le16(dt),...le16(dd),...le32(crc),...le32(sz),...le32(sz),...le16(nm.length),...le16(0)]);
    parts.push(lh,nm,f.data);
    cd.push(Uint8Array.from([0x50,0x4b,1,2,...le16(20),...le16(20),...le16(0x0800),...le16(0),...le16(dt),...le16(dd),...le32(crc),...le32(sz),...le32(sz),...le16(nm.length),...le16(0),...le16(0),...le16(0),...le16(0),...le32(0),...le32(off)]),nm);
    off+=lh.length+nm.length+sz;
  }
  const cdSize=cd.reduce((a,x)=>a+x.length,0);
  const end=Uint8Array.from([0x50,0x4b,5,6,0,0,0,0,...le16(files.length),...le16(files.length),...le32(cdSize),...le32(off),0,0]);
  return new Blob(parts.concat(cd,[end]),{type:'application/zip'});
}
let dlPromise=null;
function getDownloads(){
  if(!dlPromise){
    let p=null;
    try{ if(window.claude&&window.claude.use) p=window.claude.use('downloads'); }catch(e){}
    dlPromise=p?Promise.race([Promise.resolve(p).catch(()=>null),new Promise(r=>setTimeout(()=>r(null),5000))]):Promise.resolve(null);
  }
  return dlPromise;
}
function exportName(){
  const key=spell(st.key).replace('#','sharp');
  return 'CH-1 '+key+' '+MODES[st.mode].short.toLowerCase().replace('.','')+' '+st.bpm+'bpm';
}
let exporting=false;
async function exportMidi(){
  if(exporting) return;
  const midi=buildMidi();
  if(!midi){ toast('ADD CHORDS FIRST'); return; }
  exporting=true;
  const base=exportName();
  try{
    const dl=await getDownloads();
    if(dl){
      // This viewer cannot save .mid directly, so send a zip. Files on iPhone opens it with one tap.
      const txt='CH-1 Chord Forge\r\nKey: '+spell(st.key)+' '+MODES[st.mode].name+'\r\nTempo: '+st.bpm+' BPM\r\nSteps of '+st.len+' beat(s)\r\n\r\n'+progressionText()+'\r\n';
      const zip=makeZip([{name:base+'.mid',data:midi},{name:base+' chords.txt',data:new TextEncoder().encode(txt)}]);
      try{ await dl.save({filename:base+'.zip',data:zip}); toast('SAVED · TAP ZIP IN FILES'); }
      catch(e){ toast(e&&e.code==='declined'?'EXPORT CANCELLED':'SAVE NOT AVAILABLE HERE'); }
      return;
    }
    const file=new File([midi],base+'.mid',{type:'audio/midi'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:base}); toast('SHARED'); return; }
    }catch(e){ if(e&&e.name==='AbortError'){ toast('EXPORT CANCELLED'); return; } }
    const url=URL.createObjectURL(new Blob([midi],{type:'audio/midi'}));
    const a=document.createElement('a');a.href=url;a.download=base+'.mid';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast('DOWNLOADING .MID');
  } finally { exporting=false; }
}
$('#bExport').addEventListener('click',exportMidi);

/* first-touch audio wake (iOS needs a gesture) */
document.addEventListener('pointerdown',()=>{ if(!ctx) ensureAudio(); else if(ctx.state!=='running') ensureAudio(); },{capture:true});

/* boot */
refreshAll();baseMsg();updateSig();setTimeout(getDownloads,0);
requestAnimationFrame(frame);
window.__ch1={st,buildChord,voiceChord,buildMidi,makeZip};
})();
